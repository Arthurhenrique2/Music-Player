
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0a12">
<title>NOCTAVE — Music 2.0</title>
<style>
:root {
  --bg:#0b0a12;
  --panel:#171522;
  --accent:#b38aff;
  --text:#faf8ff;
  --muted:#9993ac;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent)}
.shell{display:flex;min-height:100vh;padding-bottom:110px}
aside{width:225px;flex-shrink:0;background:#12101b;padding:28px 16px;border-right:1px solid #ffffff12}
.logo{font-size:25px;font-weight:900;letter-spacing:-1.5px;margin-bottom:42px}
.logo span{color:var(--accent)}
nav button{display:block;width:100%;border:0;background:transparent;color:#a9a3b8;text-align:left;padding:15px;border-radius:13px;margin:5px 0}
nav button.active,nav button:hover{background:#a57cff20;color:white}
main{flex:1;min-width:0;padding:30px clamp(16px,4vw,52px)}
.search{display:flex;gap:10px;background:#1b1928;border:1px solid #ffffff14;border-radius:15px;padding:13px 16px;margin-bottom:27px}
.search input{flex:1;min-width:0;background:none;border:0;color:white;outline:0}
.hero{min-height:235px;border-radius:25px;background:radial-gradient(circle at 85% 30%,#a46dff88,transparent 38%),linear-gradient(110deg,#51318b,#20192f);padding:32px;position:relative;overflow:hidden}
.hero:after{content:"♫";position:absolute;right:7%;top:-35px;font-size:260px;color:#ffffff16;transform:rotate(-15deg);pointer-events:none}
.hero small{font-weight:800;letter-spacing:2px;color:#d7c5ff}
.hero h1{font-size:clamp(34px,5vw,60px);line-height:1;margin:16px 0;letter-spacing:-2px}
.hero h1 span{color:#d9bdff}
.hero p{color:#e0d5f4;font-size:14px;max-width:410px}
.action{background:#ae87ff;color:#120d21;border:0;padding:12px 18px;border-radius:12px;font-weight:800}
.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:29px 0 17px}
h2{font-size:22px;letter-spacing:-.5px;margin:0}
.muted{color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:15px}
.card{padding:12px;border-radius:18px;background:#191725;border:1px solid #ffffff0e;min-width:0;transition:.2s}
.card:hover{background:#252034;transform:translateY(-3px)}
.cover{width:100%;aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#7654b7,#24213c);object-fit:cover;display:grid;place-items:center;font-size:55px}
.card b{display:block;margin-top:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:14px}
.card small{display:block;color:var(--muted);margin:5px 0 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-actions{display:flex;gap:7px}
.card-actions button{background:#302743;color:white;border:0;border-radius:9px;padding:9px;flex:1}
.card-actions .listen{background:#a17af2;font-weight:800}
.empty{padding:35px;border:1px dashed #ffffff25;border-radius:15px;color:var(--muted);grid-column:1/-1;text-align:center}
.player{position:fixed;bottom:0;left:0;right:0;background:#181523f5;backdrop-filter:blur(20px);border-top:1px solid #ffffff17;padding:13px 25px;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;gap:20px;z-index:5}
.song{display:flex;gap:12px;align-items:center;min-width:0}
.art{height:52px;width:52px;border-radius:11px;background:linear-gradient(135deg,#a982ff,#3d2c61);display:grid;place-items:center;font-size:27px;overflow:hidden;flex-shrink:0}
.art img{width:100%;height:100%;object-fit:cover}
.songtext{min-width:0}
.songtext b,.songtext small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songtext b{font-size:13px}
.songtext small{font-size:11px;color:var(--muted);margin-top:4px}
.controls{text-align:center}
.controls button{border:0;background:none;color:white;font-size:19px;margin:0 8px}
.controls #play{background:#b18aff;color:#130e20;border-radius:50%;height:39px;width:39px;font-weight:900}
.timeline{display:flex;gap:10px;align-items:center;font-size:10px;color:var(--muted);margin-top:8px}
input[type=range]{accent-color:var(--accent);width:100%}
.volume{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.volume input{max-width:115px}
#status{position:fixed;bottom:105px;right:18px;background:#3c295b;padding:12px 17px;border-radius:12px;display:none;z-index:10;font-size:12px}
@media(max-width:700px){
 .shell{display:block;padding-bottom:160px}
 aside{position:fixed;bottom:0;left:0;right:0;width:100%;height:63px;padding:5px;z-index:7;display:flex;align-items:center;justify-content:center;border-top:1px solid #ffffff17}
 .logo{display:none}
 nav{display:flex;justify-content:space-evenly;width:100%}
 nav button{text-align:center;margin:0;font-size:12px;padding:12px 6px}
 main{padding:18px}
 .hero{padding:24px;min-height:205px}
 .hero:after{right:-20px;font-size:180px;top:0}
 .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .player{bottom:63px;padding:10px 13px;grid-template-columns:1fr auto;border-radius:15px 15px 0 0}
 .controls{display:flex;align-items:center}
 .controls button{margin:0 5px;font-size:15px}
 .timeline,.volume{display:none}
 #status{bottom:145px}
}
</style>
</head>
<body>
<div class="shell">
<aside>
  <div class="logo">♫ NOCT<span>AVE</span></div>
  <nav>
    <button class="active" data-tab="radio">◉ Explorar</button>
    <button data-tab="local">♫ Biblioteca</button>
    <button data-tab="fav">♡ Favoritos</button>
    <button id="importMenu">＋ Importar</button>
  </nav>
</aside>
<main>
  <label class="search">
    <span>⌕</span>
    <input id="query" placeholder="Pesquisar rádios e músicas...">
  </label>
  <section class="hero">
    <small>✦ MUSIC 2.0</small>
    <h1>Your sound.<br><span>Your universe.</span></h1>
    <p>Descubra rádios online, importe suas músicas e crie seu próprio espaço musical.</p>
    <button class="action" id="importHero">＋ Importar músicas</button>
  </section>
  <div class="heading">
    <h2 id="heading">Explore o som</h2>
    <span class="muted" id="counter">Rádios online</span>
  </div>
  <div class="cards" id="cards"></div>
</main>
</div>

<div class="player">
  <div class="song">
    <div class="art" id="art">♫</div>
    <div class="songtext">
      <b id="title">Nada tocando</b>
      <small id="artist">Escolha uma faixa</small>
    </div>
  </div>
  <div class="controls">
    <div>
      <button id="prev">⏮</button>
      <button id="play">▶</button>
      <button id="next">⏭</button>
    </div>
    <div class="timeline">
      <span id="time">0:00</span>
      <input id="progress" type="range" min="0" max="100" value="0">
      <span id="length">0:00</span>
    </div>
  </div>
  <div class="volume">♫ <input id="volume" type="range" min="0" max="100" value="80"></div>
</div>

<div id="status"></div>
<input id="file" type="file" accept="audio/*" multiple hidden>
<audio id="audio"></audio>

<script>
const $=s=>document.querySelector(s);
const audio=$("#audio");
const dbName="noctave-storage";
let db,tab="radio",tracks=[],radios=[],favorites=[];
let current=null,queue=[],queueIndex=0,searchId=0,timer;
let objectUrl=null;

function toast(s){
  $("#status").textContent=s;
  $("#status").style.display="block";
  clearTimeout(timer);
  timer=setTimeout(()=>$("#status").style.display="none",3200);
}
function textTime(n){
  if(!Number.isFinite(n))return "LIVE";
  return Math.floor(n/60)+":"+String(Math.floor(n%60)).padStart(2,"0");
}
function getStore(name,mode="readonly"){
  return db.transaction(name,mode).objectStore(name);
}
function getAll(name){
  return new Promise((resolve,reject)=>{
    const q=getStore(name).getAll();
    q.onsuccess=()=>resolve(q.result);
    q.onerror=()=>reject(q.error);
  });
}
function put(name,value){
  return new Promise((resolve,reject)=>{
    const q=getStore(name,"readwrite").put(value);
    q.onsuccess=()=>resolve();
    q.onerror=()=>reject(q.error);
  });
}
function del(name,key){
  return new Promise((resolve,reject)=>{
    const q=getStore(name,"readwrite").delete(key);
    q.onsuccess=()=>resolve();
    q.onerror=()=>reject(q.error);
  });
}
async function init(){
  try{
    db=await new Promise((resolve,reject)=>{
      const q=indexedDB.open(dbName,1);
      q.onupgradeneeded=()=>{
        const d=q.result;
        d.createObjectStore("songs",{keyPath:"id"});
        d.createObjectStore("favorites",{keyPath:"id"});
      };
      q.onsuccess=()=>resolve(q.result);
      q.onerror=()=>reject(q.error);
    });
    tracks=await getAll("songs");
    favorites=await getAll("favorites");
  }catch(e){
    toast("Armazenamento indisponível neste navegador.");
  }
  await findRadios("");
}
function localItem(f){
  return {id:"file-"+crypto.randomUUID(),name:f.name.replace(/\.[^.]+$/,""),artist:"Meu dispositivo",type:"local",blob:f};
}
async function importFiles(files){
  if(!db){toast("Armazenamento indisponível.");return}
  let added=0;
  for(const f of files){
    if(!f.type.startsWith("audio/")&&!/\.(mp3|ogg|wav|m4a|flac)$/i.test(f.name))continue;
    try{
      const item=localItem(f);
      await put("songs",item);
      tracks.push(item);
      added++;
    }catch(e){
      toast("Espaço insuficiente ou arquivo muito grande.");
      break;
    }
  }
  $("#file").value="";
  toast(added+" música(s) importada(s).");
  setTab("local");
}
function setTab(t){
  tab=t;searchId++;
  $("#query").value="";
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  $("#heading").textContent=t==="radio"?"Rádios para descobrir":t==="local"?"Sua biblioteca":"Suas favoritas";
  $("#counter").textContent=t==="radio"?"Ao vivo":t==="local"?"Salvas no navegador":"Sua coleção";
  render();
}
function filtered(){
  const q=$("#query").value.toLowerCase().trim();
  const source=tab==="radio"?radios:tab==="local"?tracks:
    favorites.map(f=>f.type==="local"?tracks.find(x=>x.id===f.id):f).filter(Boolean);
  return source.filter(t=>(t.name+" "+(t.artist||"")).toLowerCase().includes(q));
}
function render(){
  const items=filtered(),root=$("#cards");
  root.replaceChildren();
  if(!items.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent=tab==="local"?"Importe músicas do seu dispositivo para começar.":"Nenhum resultado encontrado.";
    root.append(e);return;
  }
  for(const t of items){
    const card=document.createElement("div");card.className="card";
    const cover=document.createElement("div");cover.className="cover";
    if(t.image){
      const img=document.createElement("img");
      img.src=t.image;img.alt="";
      img.style.cssText="width:100%;height:100%;object-fit:cover;border-radius:12px";
      img.onerror=()=>{img.remove();cover.textContent="♫"};
      cover.append(img);
    }else cover.textContent="♫";
    const title=document.createElement("b");title.textContent=t.name;
    const artist=document.createElement("small");artist.textContent=t.artist||"Rádio online";
    const actions=document.createElement("div");actions.className="card-actions";
    const listen=document.createElement("button");listen.className="listen";listen.textContent="▶ Ouvir";
    listen.onclick=()=>start(items,items.indexOf(t));
    const heart=document.createElement("button");
    heart.textContent=favorites.some(x=>x.id===t.id)?"♥":"♡";
    heart.onclick=()=>toggleFav(t);
    actions.append(listen,heart);
    if(t.type==="local"){
      const remove=document.createElement("button");remove.textContent="⋯";
      remove.title="Excluir música";
      remove.onclick=()=>removeSong(t);
      actions.append(remove);
    }
    card.append(cover,title,artist,actions);
    root.append(card);
  }
}
async function toggleFav(t){
  if(!db)return;
  const old=favorites.find(x=>x.id===t.id);
  try{
    if(old){await del("favorites",t.id);favorites=favorites.filter(x=>x.id!==t.id)}
    else{
      const entry={id:t.id,name:t.name,artist:t.artist,image:t.image||"",url:t.url||"",type:t.type};
      await put("favorites",entry);favorites.push(entry);
    }
    render();
  }catch(e){toast("Não foi possível salvar o favorito.")}
}
async function removeSong(t){
  if(!db||!confirm("Excluir esta música da biblioteca?"))return;
  await del("songs",t.id);
  tracks=tracks.filter(x=>x.id!==t.id);
  if(current?.id===t.id){audio.pause();audio.removeAttribute("src");current=null;audio.load();$("#title").textContent="Nada tocando"}
  render();
}
async function findRadios(q){
  const token=++searchId;
  $("#cards").innerHTML='<div class="empty">Buscando rádios...</div>';
  for(const host of ["https://de1.api.radio-browser.info","https://nl1.api.radio-browser.info"]){
    try{
      const u=new URL(host+"/json/stations/search");
      u.searchParams.set("limit","36");
      u.searchParams.set("hidebroken","true");
      u.searchParams.set("order","votes");
      u.searchParams.set("reverse","true");
      if(q)u.searchParams.set("name",q);
      else u.searchParams.set("countrycode","BR");
      const r=await fetch(u);
      if(!r.ok)throw Error("Serviço indisponível");
      const data=await r.json();
      if(token!==searchId||tab!=="radio")return;
      radios=data.filter(x=>x.url_resolved&&x.name).map(x=>({
        id:"radio-"+x.stationuuid,
        name:x.name,
        artist:x.country||"Rádio",
        image:x.favicon,
        url:x.url_resolved,
        type:"radio"
      }));
      render();return;
    }catch(e){console.warn(e)}
  }
  if(token===searchId)$("#cards").innerHTML='<div class="empty">A pesquisa online está temporariamente indisponível.</div>';
}
async function start(items,i){
  const t=items[i];
  if(!t)return;
  const real=t.type==="local"?(tracks.find(x=>x.id===t.id)||t):t;
  if(real.type==="local"&&!real.blob){toast("Arquivo não encontrado.");return}
  if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}
  current=real;queue=items;queueIndex=i;
  audio.pause();
  if(real.type==="local"){
    objectUrl=URL.createObjectURL(real.blob);
    audio.src=objectUrl;
  }else audio.src=real.url;
  $("#title").textContent=real.name;
  $("#artist").textContent=real.artist;
  $("#art").textContent="♫";
  if(real.image){
    const img=document.createElement("img");img.src=real.image;img.alt="";
    $("#art").replaceChildren(img);
  }
  if("mediaSession" in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({
      title:real.name,artist:real.artist||"NOCTAVE",album:"Music 2.0",
      artwork:real.image?[{src:real.image}]:[]
    });
  }
  try{await audio.play()}catch(e){toast("Não foi possível tocar esta fonte de áudio.")}
}
function next(dir){
  if(!queue.length)return;
  start(queue,(queueIndex+dir+queue.length)%queue.length);
}
$("#play").onclick=()=>{
  if(!current){toast("Escolha uma música.");return}
  if(audio.paused)audio.play().catch(()=>toast("Reprodução bloqueada."));
  else audio.pause();
};
$("#next").onclick=()=>next(1);
$("#prev").onclick=()=>next(-1);
audio.onplay=()=>{$("#play").textContent="Ⅱ"};
audio.onpause=()=>{$("#play").textContent="▶"};
audio.ontimeupdate=()=>{
  $("#time").textContent=textTime(audio.currentTime);
  if(Number.isFinite(audio.duration)&&audio.duration>0)
    $("#progress").value=audio.currentTime/audio.duration*100;
};
audio.onloadedmetadata=()=>{
  $("#length").textContent=textTime(audio.duration);
  $("#progress").disabled=!Number.isFinite(audio.duration);
};
audio.onended=()=>next(1);
audio.onerror=()=>{if(current)toast("Formato ou transmissão não suportada.")};
$("#progress").oninput=e=>{
  if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(e.target.value)/100;
};
$("#volume").oninput=e=>audio.volume=Number(e.target.value)/100;
audio.volume=.8;
if("mediaSession" in navigator){
  for(const [name,fn] of Object.entries({
    play:()=>audio.play(),pause:()=>audio.pause(),
    nexttrack:()=>next(1),previoustrack:()=>next(-1),
    seekto:e=>{if(Number.isFinite(audio.duration))audio.currentTime=e.seekTime}
  })){
    try{navigator.mediaSession.setActionHandler(name,fn)}catch(e){}
  }
}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function askFile(){$("#file").click()}
$("#importMenu").onclick=askFile;
$("#importHero").onclick=askFile;
$("#file").onchange=e=>importFiles([...e.target.files]);
let debounce;
$("#query").oninput=()=>{
  clearTimeout(debounce);
  if(tab==="radio")debounce=setTimeout(()=>findRadios($("#query").value.trim()),450);
  else render();
};
init();
</script>
</body>
</html>
